services:
  # ----------------------------------------------------
  # 1. NearStyle Backend REST API (Node.js Web Service)
  # ----------------------------------------------------
  - type: web
    name: nearstyle-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://nearstyle-frontend.onrender.com

  # ----------------------------------------------------
  # 2. NearStyle Frontend (React + Vite Static Site)
  # ----------------------------------------------------
  - type: web
    name: nearstyle-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev --include=optional && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_URL
        value: https://nearstyle-backend.onrender.com
