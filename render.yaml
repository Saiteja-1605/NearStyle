# Render Blueprint Specification for NearStyle
# Deploys both NearStyle Backend (Web Service) and NearStyle Frontend (Static Site)

services:
  # ---------------------------------------------------------------------------
  # 1. NearStyle Backend REST API (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: nearstyle-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set in Render Dashboard: Atlas MongoDB Connection String
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromStaticSite:
          name: nearstyle-frontend
          property: url

  # ---------------------------------------------------------------------------
  # 2. NearStyle Frontend (Static Site)
  # ---------------------------------------------------------------------------
  - type: static
    name: nearstyle-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nearstyle-backend
          property: url
